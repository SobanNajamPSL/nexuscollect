services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexuscollect}
      POSTGRES_USER: ${POSTGRES_USER:-nexuscollect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexuscollect}
    ports:
      - "5432:5432"
    volumes:
      - nexuscollect_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexuscollect} -d ${POSTGRES_DB:-nexuscollect}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexuscollect}:${POSTGRES_PASSWORD:-nexuscollect}@db:5432/${POSTGRES_DB:-nexuscollect}
      DEMO_MODE: ${DEMO_MODE:-true}
      API_PORT: ${API_PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nexuscollect_db_data:
